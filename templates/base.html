<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#070b14">
  <meta name="description" content="{% block description %}FusionTECH Dynamics develops intelligent aerospace, UAV, avionics, simulation, and real-time embedded systems.{% endblock %}">
  <title>{% block title %}FusionTECH Dynamics | Intelligent Aerospace Systems{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  {% block head %}{% endblock %}
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <div class="page-noise" aria-hidden="true"></div>
  {% include 'header.html' %}
  <main id="main-content">
    {% block content %}{% endblock %}
  </main>
  {% include 'footer.html' %}
  <script src="{{ url_for('static', filename='js/main.js') }}" defer></script>
  {% block scripts %}{% endblock %}
</body>
</html>
